    <!-- Google Fonts Optimization -->
    <script>
      (function() {
        // Safe WebSocket proxy for Vite HMR in cloud preview/sandboxed environments
        try {
          var NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' ||
                (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite-hmr') !== -1))
              ) {
                var listeners = {};
                var mockSocket = {
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  url: url,
                  protocol: 'vite-hmr',
                  addEventListener: function(type, fn) {
                    listeners[type] = listeners[type] || [];
                    listeners[type].push(fn);
                    if (type === 'open') {
                      setTimeout(function() {
                        try { fn({ type: 'open' }); } catch(_) {}
                      }, 10);
                    }
                  },
                  removeEventListener: function(type, fn) {
                    if (!listeners[type]) return;
                    listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                  },
                  send: function() {},
                  close: function() {}
                };
                return mockSocket;
              }
              return new NativeWebSocket(url, protocols);
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.OPEN = NativeWebSocket.OPEN;
            window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
            window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
            window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          }
        } catch(_) {}

        var isBenignSystemNotice = function(args) {
          try {
            var msg = Array.prototype.slice.call(args).map(function(a) {
              if (a === null || a === undefined) return '';
              if (typeof a === 'object') {
                return (a.name || '') + ' ' + (a.message || '') + ' ' + (a.stack || '') + ' ' + JSON.stringify(a);
              }
              return String(a);
            }).join(' ');
            return msg.indexOf('BloomFilter') !== -1 || 
                   msg.indexOf('Invalid hash count') !== -1 || 
                   msg.indexOf('Applying bloom filter failed') !== -1 ||
                   msg.indexOf('WebSocket') !== -1 ||
                   msg.indexOf('@vite/client') !== -1 ||
                   msg.indexOf('failed to connect to websocket') !== -1 ||
                   msg.indexOf('vite:ws') !== -1;
          } catch(e) {
            return false;
          }
        };

        var origError = console.error;
        console.error = function() {
          if (isBenignSystemNotice(arguments)) return;
          return origError.apply(console, arguments);
        };

        var origWarn = console.warn;
        console.warn = function() {
          if (isBenignSystemNotice(arguments)) return;
          return origWarn.apply(console, arguments);
        };

        var origInfo = console.info;
        console.info = function() {
          if (isBenignSystemNotice(arguments)) return;
          return origInfo.apply(console, arguments);
        };

        var origLog = console.log;
        console.log = function() {
          if (isBenignSystemNotice(arguments)) return;
          return origLog.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = e && e.message ? String(e.message) : '';
          var filename = e && e.filename ? String(e.filename) : '';
          if (
            msg.indexOf('BloomFilter') !== -1 || 
            msg.indexOf('Invalid hash count') !== -1 ||
            msg.indexOf('Applying bloom filter failed') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            filename.indexOf('@vite/client') !== -1 ||
            msg.indexOf('is not a valid JavaScript MIME type') !== -1 ||
            msg.indexOf('Expected a JavaScript-friendly MIME type') !== -1 ||
            msg.indexOf('Failed to fetch dynamically imported module') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (msg.indexOf('MIME type') !== -1 || msg.indexOf('dynamically imported') !== -1) {
              try {
                var reloadKey = 'chunk_reload_' + window.location.pathname;
                if (!sessionStorage.getItem(reloadKey)) {
                  sessionStorage.setItem(reloadKey, '1');
                  sessionStorage.setItem('__tw_chunk_reload_trigger__', JSON.stringify({
                    source: 'index_error',
                    timestamp: new Date().toISOString(),
                    pathname: window.location.pathname,
                    reasonSnippet: msg.slice(0, 120)
                  }));
                  setTimeout(function() { window.location.reload(); }, 150);
                }
              } catch(_) {}
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason ? String(e.reason.message || e.reason) : '';
          if (
            reason.indexOf('BloomFilter') !== -1 || 
            reason.indexOf('Invalid hash count') !== -1 ||
            reason.indexOf('Applying bloom filter failed') !== -1 ||
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('@vite/client') !== -1 ||
            reason.indexOf('failed to connect to websocket') !== -1 ||
            reason.indexOf('vite:ws') !== -1 ||
            reason.indexOf('is not a valid JavaScript MIME type') !== -1 ||
            reason.indexOf('Expected a JavaScript-friendly MIME type') !== -1 ||
            reason.indexOf('Failed to fetch dynamically imported module') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            if (reason.indexOf('MIME type') !== -1 || reason.indexOf('dynamically imported') !== -1) {
              try {
                var reloadKey = 'chunk_reload_' + window.location.pathname;
                if (!sessionStorage.getItem(reloadKey)) {
                  sessionStorage.setItem(reloadKey, '1');
                  sessionStorage.setItem('__tw_chunk_reload_trigger__', JSON.stringify({
                    source: 'index_unhandledrejection',
                    timestamp: new Date().toISOString(),
                    pathname: window.location.pathname,
                    reasonSnippet: reason.slice(0, 120)
                  }));
                  setTimeout(function() { window.location.reload(); }, 150);
                }
              } catch(_) {}
            }
          }
        }, true);
      })();
    </script>
