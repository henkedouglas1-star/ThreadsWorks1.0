<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Soft Outer Ambient Glow -->
    <filter id="twGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Primary Thread Stream Gradient -->
    <linearGradient id="twThreadPrimary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E9D5FF" />
      <stop offset="65%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Secondary Counter Loop Gradient -->
    <linearGradient id="twThreadSecondary" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6B21A8" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Central Core AI Diamond Radial Gradient -->
    <radialGradient id="twCoreSpark" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3E8FF" />
      <stop offset="75%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#9333EA" />
    </radialGradient>

    <!-- Squircle Dark Container Background -->
    <radialGradient id="twSquircleBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1C0B3B" />
      <stop offset="65%" stop-color="#0B0318" />
      <stop offset="100%" stop-color="#04010A" />
    </radialGradient>

    <!-- Container Refined Metallic Border -->
    <linearGradient id="twSquircleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6B21A8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Black Rounded Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#twSquircleBg)" stroke="url(#twSquircleBorder)" stroke-width="3" />

  <!-- SYMBOL EMBLEM GEOMETRY -->
  <g transform="translate(0, 0)">
    <!-- Primary Thread Loop Stream -->
    <path 
      d="M 160 120 
         C 80 200, 90 340, 210 400 
         C 330 460, 430 340, 390 220 
         C 360 120, 240 80, 160 120 Z"
      fill="none"
      stroke="url(#twThreadPrimary)"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Counter Interlocking Loop Stream -->
    <path 
      d="M 352 392 
         C 432 312, 422 172, 302 112 
         C 182 52, 82 172, 122 292 
         C 152 392, 272 432, 352 392 Z"
      fill="none"
      stroke="url(#twThreadSecondary)"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Central Intelligent AI Diamond Core -->
    <path 
      d="M 256 168 
         C 266 216 296 246 344 256 
         C 296 266 266 296 256 344 
         C 246 296 216 266 168 256 
         C 216 246 246 216 256 168 Z" 
      fill="url(#twCoreSpark)" 
    />

    <!-- Inner Precision White Spark Highlight -->
    <path 
      d="M 256 216 
         C 260 238 274 252 296 256 
         C 274 260 260 274 256 296 
         C 252 274 238 260 216 256 
         C 238 252 252 238 256 216 Z" 
      fill="#FFFFFF" 
    />

    <!-- Luminous Connected Workflow Nodes -->
    <circle cx="390" cy="160" r="18" fill="url(#twCoreSpark)" />
    <circle cx="122" cy="352" r="14" fill="#E9D5FF" />
  </g>
</svg>
