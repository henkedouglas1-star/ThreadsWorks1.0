<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000" />
  
  <!-- Definitions for gradients and glows -->
  <defs>
    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="tw-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Glowing background for the icon -->
  <rect x="730" y="160" width="380" height="380" rx="90" ry="90" fill="#120D1E" stroke="#4C1D95" stroke-width="4" filter="url(#purple-glow)" opacity="0.8" />
  <rect x="730" y="160" width="380" height="380" rx="90" ry="90" fill="#050505" stroke="#3F3F46" stroke-width="1.5" />

  <!-- Top Left Branding Header -->
  <!-- Small logo container -->
  <rect x="60" y="55" width="48" height="48" rx="12" ry="12" fill="url(#purple-gradient)" />
  <text x="84" y="87" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">tw</text>
  
  <!-- Branding Title -->
  <text x="124" y="88" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">Threads<tspan fill="#A855F7">Works</tspan></text>

  <!-- Main Left Content -->
  <!-- "Create." -->
  <text x="60" y="210" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Create.</text>
  
  <!-- "Schedule." -->
  <text x="60" y="305" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#purple-gradient)" letter-spacing="-2">Schedule.</text>
  
  <!-- "Publish." -->
  <text x="60" y="400" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="-2">Publish.</text>

  <!-- Subtitle -->
  <text x="60" y="480" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#F4F4F5">Everything You Need To</text>
  <text x="60" y="525" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#F4F4F5">Run Your Threads Content.</text>

  <!-- Small Desc -->
  <text x="60" y="580" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#A1A1AA">Generate ideas. Organize content. Schedule posts. Publish consistently.</text>

  <!-- Large "tw" app icon on the right -->
  <g transform="translate(730, 160)">
    <text x="190" y="270" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="220" font-weight="900" text-anchor="middle" letter-spacing="-10">
      <tspan fill="#FFFFFF">t</tspan><tspan fill="url(#tw-gradient)">w</tspan>
    </text>
  </g>
</svg>
